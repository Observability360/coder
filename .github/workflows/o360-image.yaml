# Builds and publishes the O360 production Coder image from any ref,
# on an ephemeral GitHub-hosted runner. The production Coder host must
# never run heavy builds (its root disk has starved mid-build before),
# so this workflow is the sanctioned build path for
# ghcr.io/observability360/coder images.
name: o360-image

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: o360-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise tools
        uses: ./.github/actions/setup-mise
        with:
          install-args: "go node pnpm protoc protoc-gen-go go:storj.io/drpc/cmd/protoc-gen-go-drpc"

      - name: GHCR Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fat linux amd64 binary
        run: |
          set -euxo pipefail
          ./.github/scripts/retry.sh -- go mod download
          make gen/mark-fresh
          version="$(./scripts/version.sh)"
          make -j build/coder_"$version"_linux_amd64

      - name: Build and push image
        id: image
        run: |
          set -euxo pipefail
          version="$(./scripts/version.sh)"
          target="ghcr.io/observability360/coder:${GITHUB_SHA}"
          ./scripts/build_docker.sh \
            --arch amd64 \
            --version "$version" \
            --target "$target" \
            --push \
            build/coder_"$version"_linux_amd64
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Print image digest
        run: |
          set -euxo pipefail
          docker buildx imagetools inspect "${{ steps.image.outputs.target }}"
